<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>오운완</title>
<meta name="description" content="오운완 — 헬스 기구 세트·식단 기록과 근거 기반 운동 분석">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오운완">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">오운<b>완</b></div>
    <div class="datenav" id="datenav">
      <button class="iconbtn" data-act="date-prev" aria-label="이전 날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="datelabel" data-act="date-today" id="datelabel">오늘</button>
      <button class="iconbtn" data-act="date-next" aria-label="다음 날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="timerbar hidden" id="timerbar">
  <div class="wrap">
    <div class="inner">
      <div>
        <div class="lbl" id="tb-lbl">휴식</div>
        <div class="t" id="tb-time">00:00</div>
      </div>
      <div class="ctrls">
        <button class="btn sm" data-act="timer-add" data-d="-15">−15</button>
        <button class="btn sm" data-act="timer-add" data-d="15">+15</button>
        <button class="btn sm" data-act="timer-toggle" id="tb-toggle">멈춤</button>
        <button class="btn sm ghost" data-act="timer-stop" aria-label="타이머 끄기">✕</button>
      </div>
      <div class="prog" id="tb-prog"></div>
    </div>
  </div>
</div>

<nav class="nav">
  <div class="wrap">
    <button data-act="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>운동</button>
    <button data-act="tab" data-tab="diet" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a3 3 0 0 0 3 3v7M10 3v8a3 3 0 0 1-3 3M7 3v6M17 21V3c-2.2 1-3.5 3.5-3.5 7 0 2 1.5 3 3.5 3"/></svg>식단</button>
    <button data-act="tab" data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>기록</button>
    <button data-act="tab" data-tab="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>분석</button>
    <button data-act="tab" data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M5 9h14M12 9v6M8.5 21l3.5-6 3.5 6"/></svg>바디</button>
  </div>
</nav>

<div class="scrim hidden" id="scrim" data-act="sheet-close"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh">
    <div class="tt"><h3 id="sheet-title"></h3><div class="k" id="sheet-k"></div></div>
    <button class="sheet-timer hidden" id="sheet-timer" data-act="timer-add" data-d="15" aria-label="휴식 15초 추가"><span class="l">휴식</span><b id="st-time">0:00</b><span class="p">+15</span></button>
    <button class="iconbtn" data-act="sheet-close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sb" id="sheet-body"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" class="hidden">

<script src="capacitor.js"></script>
<script src="data.js"></script>
<script src="anatomy.js"></script>
<script src="app.js"></script>
</body>
</html>
